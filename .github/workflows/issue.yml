name: 'Issue sync with Jira'
on:
  issues:
    types: [opened]

# the sync script only reads the event payload and calls the Jira API with its own token
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create ticket
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # env indirection so the secret is never materialized into the composed script
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        with:
          script: |
            const action = context.payload.action;
            if (action !== 'opened') {
              return;
            }
            const title = context.payload.issue.title;
            const body = context.payload.issue.body;

            const res = await fetch('https://algolia.atlassian.net/rest/api/2/issue', {
              method: 'POST',
              headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json',
                'Authorization': `Basic ${process.env.JIRA_TOKEN}`
              },
              body: JSON.stringify({
                fields: {
                  description: `Issue created by ${context.actor} at ${context.payload.issue.html_url} \n\n${body}`,
                  issuetype: {
                    id: '10001'
                  },
                  parent: {
                    key: 'API-1'
                  },
                  project: {
                    id: '11316'
                  },
                  summary: `[GH-ISSUE] ${title}`
                },
                update: {}
              })
            });

            if (!res.ok) {
              throw new Error(`Failed to create ticket: ${res.statusText} (${res.status}) - ${await res.text()}`);
            }

            const data = await res.json();
            console.log(`Created ticket: ${data.key}`);
